/api/imports.upload:
  post:
    summary: Stream and stage every customer CSV row
    description: |
      The console accepts CSV, XLSX and XLS files and converts the first Excel worksheet
      to CSV before upload, preserving the original filename in import history.
      API clients must send CSV bytes using fields from imports.fields. Templates and
      contact exports share those columns, including current custom labels and dynamic
      customer attributes. external_id (or legacy external_user_id), email or phone is
      required per row. Optional empty values leave existing values unchanged. UTF-8 BOM
      and quoted multiline records are supported. Read-only columns are ignored.
    operationId: uploadCustomerImport
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: filename, in: query, required: true, schema: { type: string } }
      - name: list_id
        in: query
        description: Optional target List ID. Repeat the parameter to bind every imported Customer to multiple Lists without replacing existing memberships.
        schema: { type: array, items: { type: string, minLength: 1, maxLength: 32 } }
        style: form
        explode: true
    requestBody:
      required: true
      content:
        text/csv:
          schema: { type: string, format: binary }
    responses:
      '201':
        description: Upload completely staged or explicitly rejected. A staged job has a durable background task before this response returns.
        content:
          application/json:
            schema: { $ref: '../components/schemas/import_job.yaml#/ImportJob' }
      '400': { description: Invalid CSV or configured upload limit exceeded }

/api/imports.fields:
  get:
    summary: Get the current shared customer export and import field schema
    description: Requires contacts.read or customers.read. Evaluated on every request, including custom field labels, configured customer attributes and observed profile attribute keys. Profile columns require customers.read; contacts-only readers receive the base contact fields. Headers include stable keys where labels can change. Does not return customer values.
    operationId: getCustomerFileFields
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
    responses:
      '200':
        description: Current ordered columns; response is not cached.
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [key, header, type, read_only]
                    properties:
                      key: { type: string }
                      header: { type: string }
                      type: { type: string, enum: [string, number, integer, boolean, json, datetime, auto] }
                      read_only: { type: boolean }
      '400': { description: Invalid workspace }
      '403': { description: Contact or customer read permission required }

/api/imports.get:
  get:
    summary: Get import counters and status
    operationId: getCustomerImport
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: job_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Import job
        content:
          application/json:
            schema: { $ref: '../components/schemas/import_job.yaml#/ImportJob' }
      '400': { description: Invalid workspace or import job identifier }

/api/imports.list:
  get:
    summary: List durable customer import jobs
    operationId: listCustomerImports
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    responses:
      '200':
        description: Import job history
        content:
          application/json:
            schema: { $ref: '../components/schemas/import_job.yaml#/ImportJobList' }
      '400': { description: Invalid pagination or workspace }

/api/imports.cancel:
  post:
    summary: Cancel pending import work without losing accepted rows
    description: Pending and leased rows become explicit cancelled_by_user failures in the same transaction as the job status change.
    operationId: cancelCustomerImport
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: job_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200': { description: Import cancelled }
      '400': { description: Import cannot be cancelled }

/api/imports.retry:
  post:
    summary: Retry failed rows from a completed import
    description: Successful rows remain terminal; only failed rows return to the durable pending queue.
    operationId: retryCustomerImport
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: job_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200': { description: Failed rows were queued for retry }
      '400': { description: Import has no retryable failures }

/api/imports.errors:
  get:
    summary: List or download explicit import failures
    operationId: listCustomerImportErrors
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: job_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
    responses:
      '200':
        description: Failure page or UTF-8 CSV download
        content:
          application/json:
            schema: { $ref: '../components/schemas/import_job.yaml#/ImportJobErrorList' }
          text/csv:
            schema: { type: string, format: binary }
      '400': { description: Invalid error export request }

/api/imports.process:
  post:
    summary: Process one configured import chunk (compatibility endpoint)
    deprecated: true
    operationId: processCustomerImport
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: job_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200': { description: Chunk result }
      '400': { description: Import is not processable }
