/api/audiences.create:
  post:
    summary: Create a versioned audience
    description: Saves only the structured definition. A dynamic condition audience is not materialized until a marketing run actually starts.
    operationId: createAudience
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, name, definition]
            properties:
              workspace_id: { type: string }
              name: { type: string }
              description: { type: string }
              kind: { type: string, enum: [static, dynamic, composite] }
              definition: { $ref: '../components/schemas/audience.yaml#/AudienceExpression' }
    responses:
      '201':
        description: Audience created
        content:
          application/json:
            schema: { $ref: '../components/schemas/audience.yaml#/Audience' }
      '400': { description: Invalid audience definition }

/api/audiences.get:
  get:
    summary: Get an audience
    operationId: getAudience
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: audience_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Audience
        content:
          application/json:
            schema: { $ref: '../components/schemas/audience.yaml#/Audience' }
      '400': { description: Invalid workspace or audience identifier }

/api/audiences.list:
  get:
    summary: List active audiences
    operationId: listAudiences
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    responses:
      '200': { description: Active audience page }
      '400': { description: Invalid pagination or workspace }

/api/audiences.update:
  post:
    summary: Save a new audience definition version
    operationId: updateAudience
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, audience_id, definition]
            properties:
              workspace_id: { type: string }
              audience_id: { type: string, format: uuid }
              definition: { $ref: '../components/schemas/audience.yaml#/AudienceExpression' }
    responses:
      '200': { description: Audience version created }
      '400': { description: Invalid audience version }

/api/audiences.preview:
  post:
    summary: Preview an audience with at most 100 masked customer summaries
    description: Evaluates current facts without persisting membership. Complete draft trees may be previewed while editing.
    operationId: previewAudience
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, definition]
            properties:
              workspace_id: { type: string }
              definition: { $ref: '../components/schemas/audience.yaml#/AudienceExpression' }
    responses:
      '200': { description: Audience preview }
      '400': { description: Invalid audience expression }

/api/audiences.delete:
  post:
    summary: Archive an audience that has no active dependencies
    operationId: deleteAudience
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, audience_id]
            properties:
              workspace_id: { type: string }
              audience_id: { type: string, format: uuid }
    responses:
      '200': { description: Audience archived }
      '400': { description: Audience is invalid or still referenced }

/api/audiences.build:
  post:
    summary: Materialize an audience version
    operationId: buildAudience
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, audience_id, version]
            properties:
              workspace_id: { type: string }
              audience_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    responses:
      '200': { description: Durable audience build accepted; poll buildStatus until terminal }
      '400': { description: Invalid audience version }

/api/audiences.buildStatus:
  get:
    summary: Get materialized audience build status
    operationId: getAudienceBuildStatus
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: build_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Audience build
        content:
          application/json:
            schema: { $ref: '../components/schemas/audience.yaml#/AudienceBuild' }
      '400': { description: Invalid build identifier }

/api/audiences.members:
  get:
    summary: List customers from a list, a live audience, or an immutable audience build
    description: Exactly one of list_id, audience_id, or build_id is required. Subscription status, customer attributes, and performed events are evaluated from current customer facts. Joined-list time filters apply only to list_id.
    operationId: listAudienceMembers
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: list_id, in: query, schema: { type: string, maxLength: 32 }, description: List source. Mutually exclusive with audience_id and build_id. }
      - { name: audience_id, in: query, schema: { type: string, format: uuid }, description: Live audience source evaluated from its active definition. Mutually exclusive with list_id and build_id. }
      - { name: build_id, in: query, schema: { type: string, format: uuid }, description: Immutable audience-build source. Mutually exclusive with list_id and audience_id. }
      - { name: status, in: query, schema: { type: string, enum: [active, pending, unsubscribed, bounced, complained] }, description: "Current subscription status. For audience sources, a customer matches when any current list membership has this status." }
      - { name: event_name, in: query, schema: { type: string, maxLength: 100 }, description: Require that the customer has performed this event; no event-time window is applied. }
      - { name: joined_after, in: query, schema: { type: string, format: date-time }, description: Inclusive list-membership creation time. Valid only with list_id. }
      - { name: joined_before, in: query, schema: { type: string, format: date-time }, description: Exclusive list-membership creation time. Valid only with list_id. }
      - { name: attribute_key, in: query, schema: { type: string, maxLength: 255 }, description: Customer profile attribute key. Must be supplied with attribute_value. }
      - { name: attribute_value, in: query, schema: { type: string, maxLength: 255 }, description: Case-insensitive substring matched against the selected customer profile attribute. Must be supplied with attribute_key. }
      - { name: after, in: query, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    responses:
      '200':
        description: Keyset-paginated customer members with all current list subscriptions
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '../components/schemas/audience.yaml#/AudienceMember' }
                next: { type: string, format: uuid }
      '400': { description: "Invalid source, cursor, or filter combination" }
