/api/automations.preflight:
  post:
    summary: Validate a Journey before activation
    description: Recomputes trigger, graph, content, provider, variable, frequency-policy, and webhook checks. This does not add an approval step.
    operationId: preflightAutomation
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/journey.yaml#/JourneyPreflightRequest' }
    responses:
      '200':
        description: Short-lived activation preflight
        content:
          application/json:
            schema:
              type: object
              required: [preflight]
              properties:
                preflight: { $ref: '../components/schemas/journey.yaml#/JourneyPreflightResult' }
      '400': { description: Invalid request }
      '403': { description: Automations read permission required }
      '404': { description: Automation not found }

/api/automations.activate:
  post:
    summary: Activate a Journey after a valid preflight
    description: The backend recomputes all blocking checks. Warnings require confirm_warnings; no approval workflow is added.
    operationId: activateAutomation
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/journey.yaml#/ActivateAutomationRequest' }
    responses:
      '200': { description: Journey activated }
      '400': { description: 'Preflight missing, expired, changed, blocked, or warnings not confirmed' }
      '403': { description: Automations write permission required }
      '409': { description: Automation status changed concurrently }

/api/journeys.instances:
  get:
    summary: List Journey instances for one Customer
    operationId: listJourneyInstances
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: automation_id, in: query, schema: { type: string } }
      - { name: customer_id, in: query, schema: { type: string, format: uuid } }
      - { name: customer_no, in: query, schema: { type: string } }
      - { name: external_user_id, in: query, schema: { type: string } }
      - { name: email, in: query, schema: { type: string, format: email } }
      - { name: status, in: query, schema: { type: string, enum: [active, completed, exited, failed] } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    responses:
      '200':
        description: Customer Journey instances
        content:
          application/json:
            schema: { $ref: '../components/schemas/journey.yaml#/JourneyInstanceListResponse' }
      '400': { description: Exactly one Customer locator is required }
      '403': { description: Automations read permission required }
      '404': { description: Customer not found in this Workspace }

/api/journeys.trace:
  get:
    summary: Get the explainable trace for one Journey instance
    operationId: getJourneyTrace
    security: [{ BearerAuth: [] }]
    parameters:
      - { name: workspace_id, in: query, required: true, schema: { type: string } }
      - { name: journey_instance_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Entry decisions, node events, waits, and delivery links
        content:
          application/json:
            schema:
              type: object
              required: [trace]
              properties:
                trace: { $ref: '../components/schemas/journey.yaml#/JourneyTrace' }
      '403': { description: Automations read permission required }
      '404': { description: Journey instance not found in this Workspace }
