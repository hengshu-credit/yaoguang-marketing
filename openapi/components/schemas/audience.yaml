AudienceExpression:
  type: object
  additionalProperties: false
  properties:
    leaf_type: { type: string, enum: [list, segment, audience] }
    ref_id: { type: string }
    operator: { type: string, enum: [union, intersection, exclusion] }
    children:
      type: array
      items: { $ref: '#/AudienceExpression' }
    condition: { $ref: '#/AudienceConditionTree' }

AudienceConditionTree:
  type: object
  description: A validated AND/OR condition tree over customer attributes, profile status, list state, timeline activity, and goals. Clients cannot provide SQL.
  additionalProperties: false
  required: [kind]
  properties:
    kind: { type: string, enum: [branch, leaf] }
    branch:
      type: object
      additionalProperties: false
      required: [operator, leaves]
      properties:
        operator: { type: string, enum: [and, or] }
        leaves:
          type: array
          minItems: 1
          items: { $ref: '#/AudienceConditionTree' }
    leaf:
      type: object
      description: The leaf shape is source-tagged and validated against server-side field and operator allowlists.
      additionalProperties: true
      required: [source]
      properties:
        source: { type: string, enum: [contacts, contact_lists, contact_timeline, custom_events_goals] }

Audience:
  type: object
  required: [id, name, kind, active_version]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    description: { type: string }
    kind: { type: string, enum: [static, dynamic, composite] }
    active_version: { type: integer, minimum: 1 }
    active_build_id: { type: string, format: uuid }

AudienceCustomerMatch:
  type: object
  required: [audience_id, name, kind, audience_version, matches]
  properties:
    audience_id: { type: string, format: uuid }
    name: { type: string }
    kind: { type: string, enum: [static, dynamic, composite] }
    audience_version: { type: integer, minimum: 1 }
    matches: { type: boolean }

AudienceBuild:
  type: object
  required: [id, audience_id, audience_version, status, member_count]
  properties:
    id: { type: string, format: uuid }
    audience_id: { type: string, format: uuid }
    audience_version: { type: integer, minimum: 1 }
    status: { type: string, enum: [pending, building, completed, failed, cancelled] }
    last_customer_id: { type: string, format: uuid }
    member_count: { type: integer, format: int64, minimum: 0 }
    error_detail: { type: string }

AudienceMember:
  type: object
  required: [customer, subscriptions]
  properties:
    customer:
      $ref: './customer.yaml#/CustomerSummary'
    subscriptions:
      type: array
      description: All of the customer's current list memberships and subscription statuses.
      items:
        $ref: './customer.yaml#/CustomerListMembership'
    joined_at:
      type: string
      format: date-time
      description: Time the customer joined the selected list. Present only for a list source.
