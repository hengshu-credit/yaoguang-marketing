ImportCounters:
  type: object
  required: [total, pending, processing, succeeded, failed]
  properties:
    total: { type: integer, format: int64, minimum: 0 }
    pending: { type: integer, format: int64, minimum: 0 }
    processing: { type: integer, format: int64, minimum: 0 }
    succeeded: { type: integer, format: int64, minimum: 0 }
    failed: { type: integer, format: int64, minimum: 0 }

ImportJob:
  type: object
  required: [id, status, filename, counters]
  properties:
    id: { type: string, format: uuid }
    status: { type: string, enum: [uploading, staged, processing, completed, rejected, cancelled] }
    filename: { type: string }
    list_ids:
      type: array
      description: Lists selected when the import was staged.
      items: { type: string, minLength: 1, maxLength: 32 }
    file_checksum: { type: string, minLength: 64, maxLength: 64 }
    counters: { $ref: '#/ImportCounters' }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

ImportJobList:
  type: object
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      items: { $ref: '#/ImportJob' }
    total: { type: integer, minimum: 0 }
    limit: { type: integer, minimum: 1 }
    offset: { type: integer, minimum: 0 }

ImportJobError:
  type: object
  required: [ordinal, error_code]
  properties:
    ordinal: { type: integer, format: int64, minimum: 1 }
    external_user_id: { type: string }
    display_identity: { type: string, description: Masked email or phone hint }
    error_code: { type: string }
    error_detail: { type: string }

ImportJobErrorList:
  type: object
  required: [items, total]
  properties:
    items:
      type: array
      items: { $ref: '#/ImportJobError' }
    total: { type: integer, minimum: 0 }
