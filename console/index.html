<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/images/hengshucredit_animated.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="application-name" content="Yaoguang Marketing" />
  <meta name="description" content="面向金融科技及互联网业务的开源用户营销与客户触达平台。" />
  <meta name="msapplication-TileColor" content="#1677ff" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaoguang Marketing Platform</title>
  <style>
    html,
    body,
    #root {
      min-height: 100%;
    }

    body {
      margin: 0;
    }

    .preload-splash {
      --preload-accent: #7763f1;
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    .preload-splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(22px, 3vh, 30px);
      width: clamp(112px, 10vw, 136px);
    }

    .preload-splash-logo {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .preload-splash-content {
      position: relative;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
    }

    .loader2 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: var(--preload-accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgb(119 99 241 / 28%);
      transform: translate(-50%, -50%);
    }

    .loader2::before,
    .loader2::after {
      position: absolute;
      width: 24px;
      height: 24px;
      content: '';
      background: rgb(119 99 241 / 8%);
      -webkit-animation: loader2 1.35s linear infinite;
      animation: loader2 1.35s linear infinite;
    }

    .loader2::before {
      top: -22px;
      left: 2px;
      border-top: 2px solid var(--preload-accent);
      border-right: 2px solid var(--preload-accent);
      border-radius: 0 28px 0 0;
      -webkit-transform-origin: 0 100%;
      transform-origin: 0 100%;
    }

    .loader2::after {
      top: 2px;
      right: 2px;
      border-bottom: 2px solid var(--preload-accent);
      border-left: 2px solid var(--preload-accent);
      border-radius: 0 0 0 28px;
      -webkit-transform-origin: 100% 0;
      transform-origin: 100% 0;
    }

    @-webkit-keyframes loader2 {
      to {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes loader2 {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader2::before,
      .loader2::after {
        -webkit-animation: none;
        animation: none;
      }
    }
  </style>
  <script>
    // Load config.js with cache-busting to ensure fresh configuration after setup
    document.write('<script src="/config.js?_t=' + Date.now() + '"><\/script>');
  </script>
</head>

<body>
  <div id="root">
    <div class="preload-splash">
      <div class="preload-splash-brand">
        <img src="/images/hengshucredit_animated.svg" alt="衡枢真信" class="preload-splash-logo">
        <div class="preload-splash-content" role="status" aria-label="正在加载" aria-live="polite">
          <div class="loader2" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
